[tools]
bun = "latest"
uv = "latest"

[tasks.dev]
run = "bun run dev"

[tasks.build-app]
shell = "bash"
run = "scripts/build-app.sh"

[tasks.test-notification]
run = "bun run scripts/test-notifications.js"

[tasks.firmware-build]
dir = "firmware"
run = ".venv/bin/platformio run"

[tasks.firmware-upload]
dir = "firmware"
run = ".venv/bin/platformio run --target upload"
