# Claude Pad Configuration
# This file configures the macropad middleware

device:
  # Serial port path (use `bun run src/index.ts list-devices` to find your device)
  # Option 1: Explicit port path
  # port: /dev/tty.usbmodem1234
  # Option 2: Auto-discover by USB vendor/product ID (used if port is not set)
  vendorId: 0x303A
  productId: 0x1001

# Button orientation: right (default) or left
# right: key0 = leftmost button (physical buttons are numbered right-to-left)
# left:  key0 = rightmost button (natural firmware order)
handedness: right

# Gesture detection timing (in milliseconds)
gestures:
  longPressMs: 500 # Hold time for long-press
  doublePressMs: 300 # Window to detect double-press

# Button mappings
# Each gesture can be one of three types:
#   type: action     — sends the action string to Claude Code via WebSocket (approve, deny, reset)
#   type: keybinding — sends a key combo string to Claude Code via WebSocket
#   type: global     — simulates a keypress on the host machine via AppleScript
keys:
  key0:
    press:
      type: action
      action: approve
      label: "Yes"

  key1:
    press:
      type: keybinding
      keybinding: "down"
      label: "Down"
    double_press:
      type: keybinding
      keybinding: "pagedown"
      label: "PgDn"
    long_press:
      type: keybinding
      keybinding: "end"
      label: "End"

  key2:
    press:
      type: keybinding
      keybinding: "up"
      label: "Up"
    double_press:
      type: keybinding
      keybinding: "pageup"
      label: "PgUp"
    long_press:
      type: keybinding
      keybinding: "home"
      label: "Home"

  key3:
    press:
      type: global
      keybinding: "enter"
      label: "Enter"
    double_press:
      type: global
      keybinding: "tab"
      label: "Tab"
    long_press:
      type: global
      keybinding: "esc"
      label: "Esc"

# Key Format Reference (for keybinding and global types)
# ====================
# Modifiers: ctrl+, alt+, shift+, meta+ (or cmd+, command+, win+, super+)
# Special keys: enter, tab, esc, space, backspace, delete, insert
#               home, end, pageup, pagedown (or pgup, pgdn)
#               up, down, left, right
#               f1-f12
# Printable: single characters like a, 1, /
# Sequences: comma-separated (e.g. "q, enter" sends q then enter)
#
# Examples:
#   "ctrl+c"         - Control-C (interrupt)
#   "ctrl+shift+z"   - Control-Shift-Z (redo)
#   "alt+f4"         - Alt-F4
#   "enter"          - Enter/Return key
#   "a"              - Letter 'a'
#   "q, enter"       - Key sequence: q then enter
